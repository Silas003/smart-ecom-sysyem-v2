spring.application.name=smart ecom system
spring.profiles.active=test
spring.graphql.grahiql.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.task.scheduling.enabled=true
app.cors.allowed-origins=http://localhost:3000


security.jwt.secret=${SECRET_KEY}
security.jwt.expiration-ms=3600000

app.custom.jwt-refresh.expiration-ms=604800000
security.jwt.issuer=demo-app
app.jwt.expiration=900000

spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
logging.level.org.springframework.security=DEBUG
app.oauth2.redirect-uri=http://localhost:3001/oauth2/redirect

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL}
spring.mail.password=${EMPASS}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.jmx.enabled=true

spring.datasource.hikari.maximum-pool-size=30
